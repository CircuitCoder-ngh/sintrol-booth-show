<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sintrol Dust Monitoring Showcase</title>
<meta name="description" content="Booth showcase for Sintrol: an animated dust-monitoring film with interactive products, applications, reference cases, certificates, distributors and documents.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/show.css">
</head>
<body>

<!-- Shared SVG paint servers -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
      <stop offset="0" stop-color="#009FE3"/><stop offset=".3" stop-color="#0080C4"/><stop offset=".6" stop-color="#00A696"/><stop offset=".82" stop-color="#52AE32"/><stop offset="1" stop-color="#A2C617"/>
    </linearGradient>
    <linearGradient id="g-brand-v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A696"/><stop offset="1" stop-color="#0080C4"/>
    </linearGradient>
    <linearGradient id="g-duct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE4EC"/><stop offset=".5" stop-color="#F4F7FA"/><stop offset="1" stop-color="#DCE4EC"/>
    </linearGradient>
    <linearGradient id="g-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2CCD6"/><stop offset=".5" stop-color="#7F8E9E"/><stop offset="1" stop-color="#C2CCD6"/>
    </linearGradient>
    <radialGradient id="g-puff">
      <stop offset="0" stop-color="#A89470" stop-opacity=".5"/><stop offset=".6" stop-color="#A89470" stop-opacity=".18"/><stop offset="1" stop-color="#A89470" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-steam">
      <stop offset="0" stop-color="#9DB0C2" stop-opacity=".38"/><stop offset=".6" stop-color="#9DB0C2" stop-opacity=".14"/><stop offset="1" stop-color="#9DB0C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-heat">
      <stop offset="0" stop-color="#F39200" stop-opacity=".55"/><stop offset="1" stop-color="#F39200" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="viewport">
  <div id="stage">
    <div id="bg"><div class="glow"></div><canvas id="dust" width="1920" height="1080"></canvas><div class="vignette"></div></div>

    <header id="topbar">
      <img class="logo" src="assets/img/logo.svg" alt="Sintrol">
      <div class="event"><b id="ev-name"></b><span id="ev-sub"></span></div>
    </header>

    <main id="scenes" aria-live="off"></main>

    <div id="controls" role="toolbar" aria-label="Showcase controls">
      <button id="c-prev" aria-label="Previous scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8v16zM5 19V5"/></svg></button>
      <button id="c-play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path class="i-pause" d="M7 4h4v16H7zM13 4h4v16h-4z"/><path class="i-play" d="M7 4v16l13-8z" style="display:none"/></svg></button>
      <button id="c-next" aria-label="Next scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8V4zM19 5v14"/></svg></button>
      <button id="c-fs" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>

    <nav id="rail" aria-label="Chapters">
      <svg viewBox="0 0 1920 150" aria-hidden="true">
        <defs><clipPath id="rail-clip"><rect class="clip" x="0" y="0" width="110" height="150"/></clipPath></defs>
        <line x1="110" y1="52" x2="1600" y2="52" stroke="#E3E3E3" stroke-width="1.5"/>
        <path class="trace" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2" stroke-linejoin="round"/>
        <path class="trace hot" fill="none" stroke="url(#g-brand)" stroke-width="3" stroke-linejoin="round" clip-path="url(#rail-clip)"/>
        <g class="nodes"></g>
        <circle class="slug-halo" cx="110" cy="52" r="16" fill="#0080C4" opacity=".18"/>
        <circle class="slug" cx="110" cy="52" r="7" fill="#0080C4" stroke="#FFFFFF" stroke-width="2.5"/>
      </svg>
      <div class="labels"></div>
      <button id="learn-btn" class="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>Learn more</button>
      <button id="explore-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Explore</button>
    </nav>

    <section id="deep" class="overlay" hidden aria-label="Learn more"></section>
    <section id="explore" class="overlay" hidden aria-label="Explore"></section>
    <section id="detail" class="overlay" hidden aria-label="Product details"></section>
    <section id="reader" class="overlay" hidden aria-label="Reader"></section>
    <aside id="drawer" hidden aria-label="Details"></aside>
    <div id="toast" hidden></div>
  </div>
</div>

<div id="pdf" hidden>
  <header>
    <b id="pdf-title"></b>
    <button class="btn" id="pdf-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Close document</button>
  </header>
  <iframe id="pdf-frame" title="Document viewer"></iframe>
</div>

<div id="vid" hidden>
  <header>
    <b id="vid-title"></b>
    <button class="btn" id="vid-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Close video</button>
  </header>
  <video id="vid-player" controls playsinline></video>
</div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/network.js"></script>
<script src="assets/js/world.js"></script>
<script src="assets/js/articles.js"></script>
<script src="assets/js/scenes.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
